name: Build Signed Untrack APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Release Signing Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Mayank, OU=Untrack, O=xboyrex, L=India, S=IN, C=IN"
          fi

      - name: Build Signed Release & Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Untrack-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/Untrack-v1.0.0-debug.apk
          ls -lh dist/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Untrack-Release-APK
          path: dist/Untrack-v1.0.0-release.apk
          retention-days: 90

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Untrack-Debug-APK
          path: dist/Untrack-v1.0.0-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/Untrack-v1.0.0-release.apk dist/Untrack-v1.0.0-debug.apk --clobber
          else
            gh release create "$TAG_NAME" dist/Untrack-v1.0.0-release.apk dist/Untrack-v1.0.0-debug.apk \
              --title "Untrack $TAG_NAME" \
              --notes "### Untrack $TAG_NAME — Pure Links. Zero Trackers.\n\n- **360+ Dual-Engine Sanitizers**: Full 93 domain-specific sanitizers + 14 deep surgical platform cleaners + 200+ parameter category rules.\n- **Privacy Frontend Redirects**: Instant conversion for X/Twitter, Instagram, TikTok, Reddit, Bluesky, YouTube, Pinterest, Threads, and Facebook.\n- **5-Category Private Link Guard**: Real-time leak detection for credentials, emails, JWTs, sensitive tokens, and GPS coordinates.\n- **Liquid Glass UI & 30+ Languages**: Multi-language interface, interactive parameter toggler, RE2J custom rules & teach-by-example engine, and in-app OTA updater."
          fi
